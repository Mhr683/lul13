    <!-- Old phones (Chrome 61-98, e.g. Oppo A5s): small stand-ins for newer built-in functions the app
         uses, and a report to the server if the store fails to start. Plain old JavaScript on purpose. -->
    <script>
      (function () {
        var w = window;
        try { if (typeof globalThis === 'undefined') w.globalThis = w; } catch (e) {}
        if (!w.queueMicrotask) w.queueMicrotask = function (f) { Promise.resolve().then(f); };
        if (!Promise.allSettled) Promise.allSettled = function (list) {
          return Promise.all(Array.prototype.map.call(list, function (p) {
            return Promise.resolve(p).then(function (v) { return { status: 'fulfilled', value: v }; },
              function (r) { return { status: 'rejected', reason: r }; });
          }));
        };
        function def(o, n, f) { if (!o[n]) try { Object.defineProperty(o, n, { value: f, configurable: true, writable: true }); } catch (e) {} }
        def(Array.prototype, 'flat', function (d) {
          d = d === undefined ? 1 : d;
          return Array.prototype.reduce.call(this, function (a, v) {
            return a.concat(Array.isArray(v) && d > 0 ? v.flat(d - 1) : [v]);
          }, []);
        });
        def(Array.prototype, 'flatMap', function (f, t) { return Array.prototype.map.call(this, f, t).flat(); });
        def(Array.prototype, 'at', function (n) { n = Math.trunc(n) || 0; if (n < 0) n += this.length; return this[n]; });
        def(String.prototype, 'at', function (n) { n = Math.trunc(n) || 0; if (n < 0) n += this.length; return this.charAt(n) || undefined; });
        def(String.prototype, 'replaceAll', function (a, b) {
          if (a instanceof RegExp) return this.replace(a, b);
          return this.split(a).join(typeof b === 'function' ? b(a) : b);
        });
        def(String.prototype, 'trimStart', String.prototype.trimLeft);
        def(String.prototype, 'trimEnd', String.prototype.trimRight);
        def(Object, 'fromEntries', function (it) { var o = {}; Array.from(it).forEach(function (p) { o[p[0]] = p[1]; }); return o; });
        def(Object, 'hasOwn', function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); });

        // Errors before the store has started are sent to the server (.private/client-errors.log)
        w.__anokhaErrors = [];
        function report(kind, msg) {
          try {
            var data = JSON.stringify({ kind: kind, msg: String(msg).slice(0, 1500), ua: navigator.userAgent, page: location.pathname + location.hash });
            if (navigator.sendBeacon) navigator.sendBeacon('/api/client-error', data);
            else { var x = new XMLHttpRequest(); x.open('POST', '/api/client-error'); x.send(data); }
          } catch (e) {}
        }
        w.__anokhaReport = report;
        // The installed app (home-screen icon) says that it started, to see whether its page runs at all
        try {
          if (w.matchMedia && w.matchMedia('(display-mode: standalone)').matches && /Android/.test(navigator.userAgent)) {
            report('app-start', 'installed app started');
          }
        } catch (e) {}
        w.addEventListener('error', function (e) {
          var root = document.getElementById('root');
          if (root && root.firstChild) return;
          var m = (e && (e.message || (e.error && e.error.message))) || (e && e.target && e.target.src ? 'failed to load ' + e.target.src : 'error');
          if (e && e.filename) m += ' @ ' + e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno;
          w.__anokhaErrors.push(m);
          report('error', m);
        }, true);
        w.addEventListener('unhandledrejection', function (e) {
          var root = document.getElementById('root');
          if (root && root.firstChild) return;
          var r = e && e.reason;
          var m = 'promise: ' + ((r && (r.stack || r.message)) || r);
          w.__anokhaErrors.push(m);
          report('promise', m);
        });
      })();
    </script>
    <script>
      // AI Studio Dev Environment: Suppress expected Vite HMR WebSocket closure in Cloud Run proxy
      (function() {
        function isWsError(err) {
          if (!err) return false;
          var str = String(err.message || err.reason || err.stack || err || '');
          return str.indexOf('WebSocket closed without opened') !== -1 ||
                 str.indexOf('WebSocket closed') !== -1 ||
                 (str.indexOf('WebSocket') !== -1 && str.indexOf('closed') !== -1);
        }

        window.addEventListener('unhandledrejection', function(e) {
          if (isWsError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function(e) {
          if (isWsError(e.message) || isWsError(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Filter console.error from triggering UI overlay on expected dev HMR closure
        if (typeof console !== 'undefined' && console.error) {
          var origConsoleError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            var isWs = args.some(function(arg) {
              return isWsError(arg && (arg.stack || arg.message || arg));
            });
            if (isWs) return;
            return origConsoleError.apply(console, arguments);
          };
        }

        // Intercept WebSocket creation so Vite HMR dummy-resolves cleanly
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OriginalWS = window.WebSocket;
          var ProxiedWS = function(url, protocols) {
            var isHmr = protocols === 'vite-hmr' ||
                        (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                        (typeof url === 'string' && url.indexOf('vite-hmr') !== -1);

            if (isHmr) {
              // Return a silent mock WebSocket for Vite HMR since HMR is disabled in AI Studio Cloud Run
              var listeners = {};
              var mockWs = {
                url: String(url),
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {
                  mockWs.readyState = 3;
                },
                addEventListener: function(type, listener) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(listener);
                  if (type === 'open') {
                    setTimeout(function() {
                      try {
                        listener.call(mockWs, { type: 'open', target: mockWs });
                      } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, listener) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              setTimeout(function() {
                if (typeof mockWs.onopen === 'function') {
                  try { mockWs.onopen({ type: 'open', target: mockWs }); } catch (e) {}
                }
              }, 0);
              return mockWs;
            }

            var ws = protocols !== undefined ? new OriginalWS(url, protocols) : new OriginalWS(url);
            var origAdd = ws.addEventListener.bind(ws);
            ws.addEventListener = function(type, listener, options) {
              if (type === 'close' && typeof listener === 'function') {
                var safeListener = function(event) {
                  try {
                    var res = listener.call(this, event);
                    if (res && typeof res.catch === 'function') {
                      res.catch(function() {});
                    }
                    return res;
                  } catch (err) {}
                };
                return origAdd(type, safeListener, options);
              }
              return origAdd(type, listener, options);
            };
            return ws;
          };

          ProxiedWS.prototype = OriginalWS.prototype;
          ProxiedWS.CONNECTING = OriginalWS.CONNECTING;
          ProxiedWS.OPEN = OriginalWS.OPEN;
          ProxiedWS.CLOSING = OriginalWS.CLOSING;
          ProxiedWS.CLOSED = OriginalWS.CLOSED;
          window.WebSocket = ProxiedWS;
        }
      })();
    </script>

  <body class="bg-[#FBFBF9] text-[#141413] antialiased selection:bg-[#141413] selection:text-[#FBFBF9]">
    <div id="root"></div>
    <!-- Old browsers (e.g. the Chrome an old phone came with):
         1. Chrome 61-98 does not understand "@layer" in the design file: switch it to the copy without
            layers (name.legacy.css, made by vite.config.ts), also for design files loaded later.
         2. Browsers too old to run the app at all (no modules): a short note with an "Update Chrome" button.
         3. If the store has still not appeared after 15 seconds: the reason on screen (and to the server)
            with Reload / Update Chrome buttons, instead of a white screen.
         Plain old JavaScript on purpose so every browser runs it. -->
    <script>
      (function () {
        try {
          var layers = false;
          try {
            var st = document.createElement('style');
            st.textContent = '@layer anokhaTest { #anokha-layer-test { width: 7px; } }';
            document.head.appendChild(st);
            var el = document.createElement('div');
            el.id = 'anokha-layer-test';
            document.body.appendChild(el);
            layers = el.offsetWidth === 7;
            document.body.removeChild(el);
            document.head.removeChild(st);
          } catch (e) {}
          var chrome = (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1] || '';
          if (!layers) {
            var toLegacy = function (link) {
              var h = link.getAttribute('href') || '';
              if (link.rel === 'stylesheet' && /\/assets\/[^?#]+\.css/.test(h) && !/\.legacy\.css/.test(h)) {
                link.setAttribute('href', h.replace(/\.css/, '.legacy.css'));
              }
            };
            var links = document.querySelectorAll('link[rel="stylesheet"]');
            for (var li = 0; li < links.length; li++) toLegacy(links[li]);
            if (window.MutationObserver) {
              new MutationObserver(function (list) {
                for (var a = 0; a < list.length; a++) {
                  var added = list[a].addedNodes;
                  for (var b = 0; b < added.length; b++) if (added[b].tagName === 'LINK') toLegacy(added[b]);
                }
              }).observe(document.head, { childList: true });
            }
          }

          // Store did not appear: show why (after 15 s when there was an error, 45 s on a slow network)
          var started = Date.now();
          var check = function () {
            var root = document.getElementById('root');
            if (!root || root.firstChild || document.getElementById('anokha-fail')) return;
            var errs = window.__anokhaErrors || [];
            if (!errs.length && Date.now() - started < 44000) return setTimeout(check, 5000);
            var why = errs.length ? errs[0] : 'The store did not start (no error message).';
            if (window.__anokhaReport) window.__anokhaReport('blank', 'chrome ' + chrome + ' | ' + why);
            var f = document.createElement('div');
            f.id = 'anokha-fail';
            f.setAttribute('style', 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99998;background:#F6F5F1;font-family:Arial,sans-serif;color:#141413;overflow:auto');
            f.innerHTML =
              '<div style="max-width:420px;margin:40px auto;padding:24px;background:#fff;border:1px solid #E7E5DF;border-radius:16px;text-align:center">' +
              '<h2 style="margin:0 0 8px;font-size:19px">The store could not open</h2>' +
              '<p style="margin:0 0 14px;font-size:14px;color:#55534E">Store nahi khul saka. Pehle "Reload" dabayein. Phir bhi na khule to Chrome update karein.</p>' +
              '<button onclick="location.reload()" style="display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#0E7A43;color:#fff;font-weight:bold;font-size:15px">Reload</button>' +
              '<a href="https://play.google.com/store/apps/details?id=com.android.chrome" style="display:block;margin-top:10px;padding:11px;border-radius:10px;border:1px solid #DCD9D2;color:#141413;text-decoration:none;font-size:14px">Update Chrome</a>' +
              '<p id="anokha-fail-why" style="margin:14px 0 0;font-size:11px;color:#8A8780;word-break:break-word"></p>' +
              '</div>';
            document.body.appendChild(f);
            document.getElementById('anokha-fail-why').textContent = 'Chrome ' + (chrome || '?') + ' · ' + why;
          };
          setTimeout(check, 15000);

          // Too old to run the app at all
          var modules = 'noModule' in document.createElement('script');
          var seen = false;
          try { seen = sessionStorage.getItem('oldBrowserOk') === '1'; } catch (e) {}
          if (modules || seen) return;
          var box = document.createElement('div');
          box.setAttribute('style', 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#F6F5F1;font-family:Arial,sans-serif;color:#141413;overflow:auto');
          box.innerHTML =
            '<div style="max-width:420px;margin:40px auto;padding:24px;background:#fff;border:1px solid #E7E5DF;border-radius:16px;text-align:center">' +
            '<div style="font-size:40px">&#128241;</div>' +
            '<h2 style="margin:8px 0 6px;font-size:20px">Please update Chrome</h2>' +
            '<p style="margin:0 0 6px;font-size:14px;color:#55534E">Your phone\'s browser is old, so this app cannot open properly.</p>' +
            '<p style="margin:0 0 16px;font-size:14px;color:#55534E">Aap ke phone ka Chrome purana hai. Play Store se Chrome update karein, phir app dobara kholein.</p>' +
            '<a href="https://play.google.com/store/apps/details?id=com.android.chrome" style="display:block;padding:13px;border-radius:10px;background:#0E7A43;color:#fff;font-weight:bold;text-decoration:none;font-size:15px">Update Chrome</a>' +
            '<a href="https://play.google.com/store/apps/details?id=com.google.android.webview" style="display:block;margin-top:10px;padding:11px;border-radius:10px;border:1px solid #DCD9D2;color:#141413;text-decoration:none;font-size:14px">Update Android System WebView</a>' +
            '<button id="anokha-old-continue" style="margin-top:14px;background:none;border:0;color:#6B6963;text-decoration:underline;font-size:13px">Continue anyway</button>' +
            '</div>';
          document.body.appendChild(box);
          document.getElementById('anokha-old-continue').onclick = function () {
            try { sessionStorage.setItem('oldBrowserOk', '1'); } catch (e) {}
            box.parentNode.removeChild(box);
          };
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
