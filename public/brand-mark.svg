<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" role="img" aria-label="Anokha Shopping Hub">
  <defs>
    <linearGradient id="an-green" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0B7A3E"/><stop offset="1" stop-color="#2BC774"/>
    </linearGradient>
    <linearGradient id="an-orange" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F0612C"/><stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
    <linearGradient id="an-bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22B865"/><stop offset="1" stop-color="#0B7A3E"/>
    </linearGradient>
  </defs>
  <!-- back wing -->
  <path d="M16 78 C6 50 18 22 40 6 C38 30 46 50 66 62 C52 74 34 80 16 78 Z" fill="url(#an-green)"/>
  <!-- front wing -->
  <path d="M36 84 C42 54 58 26 88 10 C80 32 82 50 92 62 C76 76 56 84 36 84 Z" fill="url(#an-orange)"/>
  <!-- head and beak -->
  <path d="M84 50 C88 38 100 34 108 40 L118 42 L108 46 C104 56 92 62 80 60 Z" fill="url(#an-orange)"/>
  <circle cx="101" cy="42" r="1.8" fill="#fff"/>
  <!-- shopping bag carried in the beak -->
  <line x1="114" y1="45" x2="114" y2="55" stroke="#F0612C" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M109 62 v-3 a5 4.5 0 0 1 10 0 v3" fill="none" stroke="#0B7A3E" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M103 61 h22 l3 21 a3 3 0 0 1 -3 3.4 h-22 a3 3 0 0 1 -3 -3.4 z" fill="url(#an-bag)"/>
  <path d="M103 61 h22 l.5 3.5 h-23 z" fill="#075A2D" opacity=".5"/>
  <path d="M107.5 73 q6.5 5 13 0" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
