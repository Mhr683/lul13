<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Anokha Shopping Hub">
  <defs>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7C985"/>
      <stop offset="1" stop-color="#A97E2C"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#141413"/>
  <!-- shopping bag: wider at the bottom, with a folded rim -->
  <path d="M17 21h30l4.6 31.5a4 4 0 0 1-4 4.5H16.4a4 4 0 0 1-4-4.5z" fill="url(#bag)"/>
  <path d="M17 21h30l.6 4H16.4z" fill="#8A6522" opacity=".55"/>
  <!-- rope handle going into the rim -->
  <path d="M25.5 26v-9a6.5 6.5 0 0 1 13 0v9" fill="none" stroke="#E7C985" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="25.5" cy="26" r="1.5" fill="#141413"/>
  <circle cx="38.5" cy="26" r="1.5" fill="#141413"/>
  <!-- the "A": two strokes with a smile as its crossbar -->
  <path d="M24.5 51 32 33.5 39.5 51" fill="none" stroke="#141413" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27.4 44.6q4.6 3.6 9.2 0" fill="none" stroke="#141413" stroke-width="2.8" stroke-linecap="round"/>
  <!-- sparkle: something unique (anokha) -->
  <path d="M45.5 31l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z" fill="#FBFBF9"/>
</svg>
